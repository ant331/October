<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>Dashboard · RTV Inventory Tracker</title>
</head>
<body>
  <header id="nav"></header>
  <main>
    <h1>Asset Movement Dashboard</h1>
    <p class="sub" id="sub">Live operational view</p>
    <div id="msg" class="msg" hidden></div>

    <!-- ===== Serialized asset KPIs ===== -->
    <section class="kpis">
      <div class="kpi"><b>Total assets</b><span id="k1" class="skel">—</span></div>
      <div class="kpi"><b>Movements recorded</b><span id="k2" class="skel">—</span></div>
      <div class="kpi"><b>Total transfers</b><span id="k3" class="skel">—</span></div>
      <div class="kpi"><b>Current locations</b><span id="k4" class="skel">—</span></div>
    </section>

    <!-- ===== Non-serialized KPIs ===== -->
    <section class="kpis" style="margin-top:14px">
      <div class="kpi"><b>Bags</b><span id="k5" class="skel">—</span></div>
      <div class="kpi"><b>Chargers</b><span id="k6" class="skel">—</span></div>
      <div class="kpi"><b>Tags</b><span id="k7" class="skel">—</span></div>
      <div class="kpi"><b>Extensions</b><span id="k8" class="skel">—</span></div>
    </section>

    <!-- ===== Pending approvals ===== -->
    <section class="kpis" style="margin-top:14px">
      <div class="kpi">
        <b>My pending approvals</b>
        <span id="k9" class="skel">—</span>
        <a href="approvals.html" style="font-size:11px;color:#2E5299;text-decoration:none">View →</a>
      </div>
    </section>

    <section class="status" id="st"></section>

    <section class="charts">
      <div class="card cbox"><canvas id="c1"></canvas></div>
      <div class="card cbox"><canvas id="c2"></canvas></div>
      <div class="card cbox loc-card">
        <div class="loc-head">
          <h3>Locations by Asset Count</h3>
          <input id="locq" placeholder="Search location…" autocomplete="off">
        </div>
        <div class="loc-list" id="loclist"></div>
      </div>
      <div class="card cbox"><canvas id="c4"></canvas></div>
    </section>
  </main>

  <style>
    .loc-card{display:flex;flex-direction:column;min-height:320px}
    .loc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
    .loc-head h3{margin:0;font-size:14px;color:#0f172a;font-weight:600}
    .loc-head input{padding:7px 10px;border:1px solid #d5dbe6;border-radius:8px;font-size:13px;min-width:180px}
    .loc-list{overflow:auto;flex:1;max-height:280px}
    .loc-row{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid #eef2f7;font-size:13px}
    .loc-row:last-child{border-bottom:0}
    .loc-name{flex:1;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .loc-bar{height:8px;border-radius:6px;background:#2E5299;min-width:4px}
    .loc-count{min-width:36px;text-align:right;color:#0f172a;font-weight:600}
    .loc-empty{color:#94a3b8;font-size:13px;padding:16px 0;text-align:center}
  </style>

  <script src="vendor/chart.umd.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notif.js"></script>
  <script>
    (async()=>{
      const me = await guard("dashboard");
      try{
        const [A,M,B] = await Promise.all([
          all("assets",[["asset_id",true]]),
          all("movements",[["moved_at",false],["id",false]]),
          all("bulk_items",[["id",true]])
        ]);

        // Count my pending approvals (destined to me as approver)
        const pendingRes = await sb.from("pending_transfers")
          .select("id",{count:"exact",head:true})
          .eq("approver_email",(me.email||"").toLowerCase())
          .eq("status","PENDING");

        const cnt=(arr,f)=>{const m=new Map();for(const x of arr){const k=f(x);if(k)m.set(k,(m.get(k)||0)+1)}return m};
        const top=(m,n)=>[...m].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0]))).slice(0,n);
        const loc=cnt(A,a=>a.current_location),st=cnt(A,a=>a.status);

        // Remove skeleton shimmer
        ["k1","k2","k3","k4","k5","k6","k7","k8","k9"]
          .forEach(id=>$("#"+id).classList.remove("skel"));

        // Serialized KPIs
        $("#k1").textContent=A.length;
        $("#k2").textContent=M.length;
        $("#k3").textContent=M.filter(r=>r.movement_type==="TRANSFER").length;
        $("#k4").textContent=loc.size;

        // Non-serialized totals
        const bulkTotals={};
        for(const r of B){
          const t=String(r.item_type||"").toUpperCase();
          bulkTotals[t]=(bulkTotals[t]||0)+(Number(r.quantity)||0);
        }
        $("#k5").textContent=bulkTotals["BAG"]||0;
        $("#k6").textContent=bulkTotals["CHARGER"]||0;
        $("#k7").textContent=bulkTotals["TAG"]||0;
        $("#k8").textContent=bulkTotals["EXTENSION"]||0;

        // Pending approvals count
        $("#k9").textContent = pendingRes.error ? 0 : (pendingRes.count ?? 0);

        // Status pills
        $("#st").innerHTML=RTV.status.map(s=>{
          const slug=String(s).replace(/\s/g,"");
          return `<div class="kpi"><b>${esc(s.toUpperCase())}</b><span>${st.get(s)||0}</span></div>`;
        }).join("");

        if(M.length)$("#sub").textContent="Live operational view · latest movement "+
          String(M[0].moved_at).slice(0,19).replace("T"," ")+" UTC";

        const act=new Map(),lab=new Map();
        for(const r of M){const a=(r.activity||"").trim();if(!a)continue;const k=a.toLowerCase();if(!lab.has(k))lab.set(k,a);act.set(k,(act.get(k)||0)+1)}

        const BRAND="#2E5299",BRAND2="#4a6db5";
        const bars=(id,title,rows,horiz)=>new Chart($("#"+id),{type:"bar",
          data:{labels:rows.map(r=>r[0]),datasets:[{data:rows.map(r=>r[1]),backgroundColor:BRAND,hoverBackgroundColor:BRAND2,borderRadius:6,maxBarThickness:34}]},
          options:{responsive:true,maintainAspectRatio:false,indexAxis:horiz?"y":"x",
            plugins:{legend:{display:false},title:{display:true,text:title,color:"#0f172a",font:{size:14,weight:"600"},padding:{bottom:14}}},
            scales:{[horiz?"x":"y"]:{beginAtZero:true,ticks:{precision:0,color:"#64748b"},grid:{color:"#eef2f7"}},
                    [horiz?"y":"x"]:{ticks:{autoSkip:false,color:"#475569"},grid:{display:false}}}}});

        bars("c1","Assets with the Most Transfers",
          top(cnt(M.filter(r=>r.movement_type==="TRANSFER"),r=>r.asset_id),10),true);
        bars("c2","Movements by Activity",
          [...act].map(([k,v])=>[lab.get(k),v]).sort((a,b)=>b[1]-a[1]),false);
        bars("c4","Asset Activity per Month",
          [...cnt(M,r=>r.moved_at&&String(r.moved_at).slice(0,7))]
            .sort((a,b)=>a[0].localeCompare(b[0])),false);

        // ---- All locations with search ----
        const allLoc=[...loc].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0])));
        const maxCount=allLoc.length?allLoc[0][1]:1;
        const list=$("#loclist"), q=$("#locq");
        function drawLocations(){
          const term=q.value.trim().toLowerCase();
          const rows=allLoc.filter(([name])=>!term||String(name).toLowerCase().includes(term));
          if(!rows.length){list.innerHTML='<div class="loc-empty">No locations match your search.</div>';return}
          list.innerHTML=rows.map(([name,n])=>`
            <div class="loc-row" title="${esc(name)} — ${n} asset(s)">
              <span class="loc-name">${esc(name)}</span>
              <span class="loc-bar" style="width:${Math.max(4,Math.round((n/maxCount)*120))}px"></span>
              <span class="loc-count">${n}</span>
            </div>`).join("");
        }
        q.oninput=drawLocations;
        drawLocations();
      }catch(e){say($("#msg"),"Could not load data: "+(e.message||e))}
    })();
  </script>
</body>
</html>
